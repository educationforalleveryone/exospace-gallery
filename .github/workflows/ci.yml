# Exospace CI pipeline
#
# Runs on every push and pull request to main. Prevents regressions by:
#   1. Running the full test suite against SQLite (phpunit.xml) and MySQL
#   2. Building the frontend (npm run build) — catches Vite config issues
#   3. Running exospace:preflight (config regressions)
#   4. Checking style on changed PHP files (Pint)
#   5. Browser smoke tests (Dusk) + dependency audits
#
# The unit/feature suite uses SQLite in-memory (phpunit.xml) so no MySQL
# service container is needed for the main job. C15 fixed the
# SQLite-incompatible migration.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# No job in this workflow needs more than reading the checkout. Explicit
# least-privilege: without this, jobs inherit the repo default token
# permissions, which may be read/write depending on repository settings.
permissions:
  contents: read

jobs:
  php-tests:
    name: PHP Tests (SQLite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, gd, exif, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        # Page-rendering feature tests resolve Vite entries through
        # public/build/manifest.json, and public/build is gitignored. Without
        # this build the suite reports >100 ViteManifestNotFoundException
        # failures that have nothing to do with the code under test — the
        # suite is only honest when the assets exist, exactly like
        # production (nixpacks.toml build phase) and the Dusk job below.
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        # Two deliberate deviations from `artisan test --parallel`:
        #   1. brianium/paratest is NOT in composer.lock, so the --parallel
        #      flag aborts with "Parallel testing is not available".
        #   2. The memory_limit is set explicitly: part of the suite peaks
        #      above the runner's CLI default.
        run: php -d memory_limit=2G vendor/bin/phpunit

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify manifest has gallery entry
        run: |
          if ! grep -q "resources/js/gallery/main.js" public/build/manifest.json; then
            echo "ERROR: gallery entry missing from Vite manifest"
            exit 1
          fi
          if ! grep -q "resources/js/admin-vendor.js" public/build/manifest.json; then
            echo "ERROR: admin-vendor entry missing from Vite manifest"
            exit 1
          fi
          echo "Vite manifest OK — gallery + admin-vendor entries present"

  php-lint:
    # Repo-wide `pint --test`. The pre-existing style debt that once made
    # this gate permanently red has been bulk-cleaned with the same Pint
    # preset (Mission: code style), so the whole tree is now enforceable.
    # A repo-wide gate is stricter than the former changed-files check: a
    # merge can no longer bring in old-style code through untouched files,
    # and there is no merge-base arithmetic to break on force-pushes or
    # single-commit branches.
    name: PHP Lint (Pint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Pint repo-wide
        run: vendor/bin/pint --test

  preflight:
    name: Preflight Check (exospace:preflight)
    runs-on: ubuntu-latest
    # Run exospace:preflight in CI on every push/PR. This catches
    # configuration regressions BEFORE they hit production — missing env vars,
    # missing PHP extensions, broken cache/queue/storage/mail config, etc.
    #
    # The preflight command is designed to be non-blocking in dev (warnings
    # don't exit non-zero), but CRITICAL failures DO exit 1, failing the CI
    # job. This is the right behavior for CI: critical config issues block
    # the deploy, warnings are surfaced for visibility.
    #
    # The preflight command needs:
    #   - APP_KEY (generated below)
    #   - CACHE_STORE=array (so we don't need Redis in CI)
    #   - QUEUE_CONNECTION=sync (so we don't need a worker in CI)
    #   - DB_CONNECTION=sqlite (file-backed, no MySQL needed)
    # All of these are set in .env.example's CI-friendly defaults, but we
    # override them explicitly here to be safe against future .env.example
    # edits that might change the defaults.

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, gd, exif, pdo, pdo_sqlite, sqlite3, redis
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # Override env vars for CI (preflight checks them)
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=array/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          # The DB must be FILE-backed, not :memory:: `migrate`, `db:seed` and
          # `exospace:preflight` below run as SEPARATE PHP processes, and an
          # in-memory sqlite database dies with the process that created it —
          # the preflight process would connect to a fresh empty database and
          # CRITICAL-fail its migrations-table/column checks. A file persists
          # across processes so the checks validate what actually migrated.
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=database/database-ci.sqlite|' .env
          # Run config cache so the env overrides take effect
          php artisan config:cache

      - name: Run migrations (file-backed sqlite)
        # Preflight checks for the `migrations` table + the `galleries.custom_domain`
        # column + the `venue_templates.visual_config` column. Without running
        # migrations first, those checks would CRITICAL-fail in CI.
        run: php artisan migrate --force

      - name: Create storage symlink
        # Preflight checks that public/storage symlink exists (CRITICAL if missing).
        run: php artisan storage:link

      - name: Seed venue templates
        # Preflight checks that venue_templates has at least 1 row (else
        # CRITICAL warning). The seeder is idempotent.
        run: php artisan db:seed --class=VenueTemplateSeeder --force

      - name: Run preflight
        run: php artisan exospace:preflight
        # Preflight exits 1 on CRITICAL failures, 0 on success/warnings-only.
        # We don't use `continue-on-error` because we WANT critical failures
        # to fail the CI job — that's the whole point of running preflight
        # in CI.
        env:
          APP_ENV: testing
          APP_DEBUG: true

  php-tests-mysql:
    # Run the test suite against MySQL (not just SQLite) to catch
    # MySQL-specific issues that SQLite hides:
    #   - Case-sensitive string comparisons (SQLite is case-insensitive by
    #     default; MySQL depends on collation)
    #   - Strict mode errors (SQLite is permissive; MySQL strict mode rejects
    #     invalid dates, truncated values, etc.)
    #   - Foreign key constraint differences
    #   - JSON column behavior differences
    #   - Partitioning (S-10) — SQLite doesn't support it at all
    name: PHP Tests (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: exospace_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # The `mysql` extension from the old list is gone for good: it was
          # removed in PHP 7 and setup-php cannot install it — the job died
          # at extension setup before running anything. pdo_mysql is the
          # driver PHP 8 uses to talk to MySQL.
          extensions: mbstring, xml, ctype, json, bcmath, gd, exif, pdo, pdo_mysql, redis
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # Override for MySQL
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=exospace_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=array/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          # NO `config:cache` here: caching would bake .env.example's redis
          # session driver (and every other driver) into the config, and the
          # phpunit.xml `array` entries cannot override a cached config —
          # every session-using test would then try to reach a Redis server
          # that does not exist in this job. Without the cache, dotenv and
          # phpunit.xml layer exactly like the sqlite job above.

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php -d memory_limit=2G vendor/bin/phpunit
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: exospace_test
          DB_USERNAME: root
          DB_PASSWORD: root

  dusk:
    # Browser tests via Laravel Dusk. Runs a headless Chrome
    # instance to verify the public-facing pages render without JS errors
    # and contain expected content.
    name: Browser Tests (Dusk)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, gd, exif, pdo, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          # Dusk resolves every visit() against config('app.url') — Browser::$baseUrl
          # comes from the BAKED config, not from phpunit.dusk.xml <env> or the step
          # env. Baking .env.example's APP_URL would target http://localhost (port 80)
          # while artisan serve listens on 8000: every visit would connection-refuse.
          sed -i 's|^APP_URL=.*|APP_URL=http://127.0.0.1:8000|' .env
          # The dusk browser talks to `php artisan serve`, a SEPARATE PHP
          # process from the test runner. With :memory: sqlite the server
          # process sees an EMPTY database (the schema created by
          # DatabaseMigrations lives only in the test process), so every
          # DB-backed page would 500. A file-backed database is shared by
          # both processes: the tests migrate it, the server reads it.
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=database/database-dusk.sqlite|' .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=array/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          # Sessions must be FILE-backed: `php artisan serve` re-boots the
          # framework on EVERY request, so the `array` driver (per-request
          # memory) loses the session between the GET that renders a CSRF
          # token and the POST that verifies it — every form submit 419s.
          # File-backed sessions survive request re-boots; `array` cache is
          # still fine because the cache never carries CSRF/session state.
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
          sed -i 's/^MAIL_MAILER=.*/MAIL_MAILER=array/' .env
          # .env.example ships bcrypt cost 12 (~500ms per hash); with a
          # throwaway sqlite DB the cheap cost declared in phpunit.dusk.xml
          # is the intended value — keeps login/register smoke flows fast
          # and far from waitFor timeouts on slower CI runners.
          sed -i 's/^BCRYPT_ROUNDS=.*/BCRYPT_ROUNDS=4/' .env
          # config:cache is REQUIRED here (unlike the test jobs): it bakes
          # the file-backed DB path into the config so BOTH the serve
          # process and the dusk test process resolve the same database
          # (and neutralizes the :memory: value phpunit.dusk.xml exports).
          php artisan config:cache

      - name: Start ChromeDriver
        # No --url-base flag: DuskTestCase connects to http://localhost:9515
        # and php-webdriver POSTs to /session on that origin. With
        # --url-base=/wd/hub chromedriver serves under /wd/hub/session and
        # every session-creation POST would 404.
        run: |
          chromedriver &
          sleep 2

      - name: Start Laravel Server
        run: |
          php artisan serve --port=8000 &
          sleep 3

      - name: Run Dusk tests
        run: php artisan dusk
        env:
          APP_ENV: dusk.testing
          APP_URL: http://127.0.0.1:8000

  dependency-audit:
    # Fails CI when locked dependencies carry known security advisories or
    # when composer.json / composer.lock / package.json / package-lock.json
    # drift apart. Both audits read the lockfiles directly — no vendor or
    # node_modules install is needed. Any advisory blocks the build: new
    # advisories against production dependencies must be reviewed, not
    # silently absorbed by a redeploy.
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate Composer manifest and lockfile
        run: composer validate --strict --no-check-publish

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Audit npm dependencies
        # --omit=dev scopes the gate to what actually SHIPS (matches the
        # production-dependency intent above). The dev/build toolchain
        # currently carries ReDoS-class advisories (tailwindcss v3 ->
        # braces/chokidar/micromatch/fast-glob) whose only fix is a breaking
        # tailwindcss v4 major — gating every push on that would keep this
        # job permanently red and ignored. Track the dev-chain advisories
        # separately.
        run: npm audit --omit=dev
