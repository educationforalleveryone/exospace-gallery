# Exospace — Testing Control Center · Profile Runner
#
# One parametrized workflow that executes ANY registered test profile
# (config/test-profiles.php) in an isolated ephemeral runner and pushes the
# JUnit artifact back to the Control Center.
#
# TRIGGERS
#   1. workflow_dispatch — "Run workflow" from GitHub UI/CLI/API:
#        profile   : which validated suite to run
#        database  : sqlite (fast) or mysql8 (fidelity)
#        coverage  : collect line coverage via PCOV (slower)
#   2. schedule          — nightly Full Regression against MySQL 8 so drift is
#                          caught even when nobody ships for a while.
#
# RESULTS
#   - JUnit artifacts are ALWAYS uploaded as workflow artifacts (never lost).
#   - When the CONTROL_CENTER_INGEST_URL + QA_INGEST_TOKEN secrets exist,
#     results are POSTed to /api/control-center/runs and appear on the
#     dashboard history within seconds.
#
name: Test Profiles

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Test profile to execute'
        required: true
        default: 'pre_release'
        type: choice
        options:
          - quick_check
          - pre_release
          - full_regression
          - security
          - billing
          - seo
          - database
      database:
        description: 'Database engine'
        required: true
        default: 'mysql8'
        type: choice
        options:
          - mysql8
          - sqlite
      coverage:
        description: 'Collect coverage (PCOV)'
        required: false
        default: false
        type: boolean

  schedule:
    # Nightly 02:17 UTC — after CI maintenance windows defined by app tasks.
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  run-profile:
    name: ${{ inputs.profile || 'full_regression (nightly)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mysql:
        # Fidelity engine matching production. The `database` profile REQUIRES
        # this; SQLite hides strict-mode, collation and partition behaviour.
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: exospace_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2 (matches the composer platform pin)
        # Production runs PHP 8.2.27 (composer.json config.platform.php, see
        # nixpacks.toml's lockfile guard). Running the suite on a NEWER PHP
        # here would repeat the exact incident class that guard exists for:
        # a lockfile resolved against 8.3 loads fine in CI and then aborts
        # the production deploy (zipstream-php requiring php-64bit ^8.3).
        # Fidelity is the whole point of this workflow — stay on 8.2.
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, gd, exif, intl, pdo, pdo_mysql, pdo_sqlite, sqlite3, redis, zip
          coverage: ${{ (inputs.coverage == true && 'pcov') || 'none' }}

      - name: Resolve job parameters
        id: params
        run: |
          if [ -z "${{ inputs.profile }}" ]; then
            echo "profile=full_regression" >> "$GITHUB_OUTPUT"     # nightly path
            echo "database=mysql8"       >> "$GITHUB_OUTPUT"
            echo "coverage=false"        >> "$GITHUB_OUTPUT"
          else
            echo "profile=${{ inputs.profile }}"    >> "$GITHUB_OUTPUT"
            echo "database=${{ inputs.database }}"  >> "$GITHUB_OUTPUT"
            echo "coverage=${{ inputs.coverage }}"  >> "$GITHUB_OUTPUT"
          fi

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        # CI FIX (2026-10-06): `composer install` runs `artisan package:discover`, which boots
        # the app BEFORE .env exists. With no APP_ENV Laravel defaults to 'production' and
        # AppServiceProvider::assertTrustedProxiesConfigured() aborts the install.
        # Declaring the environment here keeps the production guard intact.
        env:
          APP_ENV: testing
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # Isolate the PARENT process (qa:doctor / qa:run) the same way the
          # phpunit subprocess is isolated by phpunit.xml: .env.example ships
          # redis drivers for production parity, but the CI runner has no
          # Redis service — Cache::lock() and the session-poison tripwire in
          # qa:doctor would both fail against it. The suite child keeps its
          # own forced values (generated suite XML); the mysql DB_* block
          # below still points the record store at the default connection.
          # (echo-append, not a heredoc: an indented heredoc terminator is not
          # recognized by bash and would swallow the rest of the step.)
          {
            echo "APP_ENV=testing"
            echo "CACHE_STORE=array"
            echo "QUEUE_CONNECTION=sync"
            echo "SESSION_DRIVER=array"
            echo "MAIL_MAILER=array"
            # Default connection -> the workflow MySQL service container.
            # .env.example ships DB_PASSWORD empty, but the service runs with
            # MYSQL_ROOT_PASSWORD=root, so `migrate --force` below died with
            # "Access denied for user root (using password: NO)".
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=exospace"
            echo "DB_USERNAME=root"
            echo "DB_PASSWORD=root"
          } >> .env

      - name: Provision Control Center record store (default connection)
        # qa:run persists run records — including BLOCKED attempts — through the
        # DEFAULT DB connection, which on CI resolves to `.env.example`'s
        # mysql/exospace. The service container only creates `exospace_test`
        # (the SUITE's TEST_MYSQL database), so without this step the first
        # record() call dies on an unknown database / missing qa_test_runs
        # table — AFTER the tests themselves already ran. Provisioning here
        # mirrors what the deploy pipeline does in production (docker-start.sh
        # runs `migrate --force` on every container start).
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS exospace CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          php artisan migrate --force

      - name: Configure database (MySQL 8)
        if: steps.params.outputs.database == 'mysql8'
        run: |
          {
            echo "TEST_MYSQL_HOST=127.0.0.1"
            echo "TEST_MYSQL_PORT=3306"
            echo "TEST_MYSQL_DATABASE=exospace_test"
            echo "TEST_MYSQL_USERNAME=root"
            echo "TEST_MYSQL_PASSWORD=root"
          } >> .env

      - name: Build frontend assets
        # Page-rendering feature tests 500 without a Vite manifest — building
        # here keeps runs honest instead of failing on missing infrastructure.
        run: |
          npm ci
          npm run build

      - name: Doctor — validate test environment before burning a run
        run: php artisan qa:doctor --profile=${{ steps.params.outputs.profile }}

      - name: Execute profile (${{ steps.params.outputs.profile }})
        id: qa_run
        run: |
          mkdir -p storage/framework/qa
          php artisan qa:run ${{ steps.params.outputs.profile }} \
            ${{ steps.params.outputs.database == 'sqlite' && '--database=sqlite' || '' }} \
            ${{ steps.params.outputs.coverage == true && '--coverage' || '' }} \
            --no-interaction
        continue-on-error: true   # failing tests must still yield artifacts + ingest

      - name: Locate JUnit artifact
        id: artifact
        run: |
          FILE=$(ls -t storage/framework/qa/*-junit.xml | head -1)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload JUnit artifact
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ steps.params.outputs.profile }}-${{ github.sha }}
          path: ${{ steps.artifact.outputs.path }}
          retention-days: 90

      - name: Ingest into Control Center dashboard
        # Secrets and runner values are bridged through `env` instead of
        # interpolated into the command line: (1) `env` in the `if` is
        # unambiguously available, (2) untrusted values (branch names) never
        # become shell syntax, and (3) GitHub masks env values in logs the
        # same way it masks secrets.
        if: ${{ env.CONTROL_CENTER_INGEST_URL != '' && env.QA_INGEST_TOKEN != '' }}
        continue-on-error: true   # a dashboard outage must never mask test truth
        env:
          CONTROL_CENTER_INGEST_URL: ${{ secrets.CONTROL_CENTER_INGEST_URL }}
          QA_INGEST_TOKEN: ${{ secrets.QA_INGEST_TOKEN }}
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_COMMIT: ${{ github.sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "$CONTROL_CENTER_INGEST_URL" \
            -H "X-QA-Token: $QA_INGEST_TOKEN" \
            -F "junit=@${{ steps.artifact.outputs.path }}" \
            -F "profile=${{ steps.params.outputs.profile }}" \
            -F "environment=ci" \
            -F "trigger=ci" \
            -F "runner=github-actions" \
            -F "git_branch=$GIT_BRANCH" \
            -F "git_commit=$GIT_COMMIT" \
            -F "ci_run_url=$CI_RUN_URL"

      - name: Enforce result status
        if: steps.qa_run.outcome != 'success'
        run: |
          echo "::error::Profile ${{ steps.params.outputs.profile }} did not pass — see JUnit artifact and job log."
          exit 1
