# Exospace — nginx template (REFERENCE COPY — not served as-is).
#
# Nixpacks generates /assets/nginx.template.conf from ITS OWN internal
# template at image build; this repo file is never the one nginx loads.
# The effective runtime config = nixpacks' internal template + the two
# runtime patches in docker-start.sh (client_max_body_size below, the
# "exospace-dedupe-headers" removal of nixpacks' duplicate security
# headers, the "exospace-static-cache" gzip/caching block, and the
# "exospace-robots-dynamic" /robots.txt fallthrough to Laravel). Editing
# this file alone changes NOTHING in production. This copy exists so the
# shipped header set and caching windows can be reviewed as one file —
# keep it in sync with those patches (symptom of drift: static files
# carrying headers this file says are not set). See docker-start.sh §2/§2b.

worker_processes 5;
daemon off;

worker_rlimit_nofile 8192;

events {
  worker_connections  4096;  ## Default: 1024
}

http {
  include    $!{nginx}/conf/mime.types;
  index    index.html index.htm index.php;

  default_type application/octet-stream;
  log_format   main '$remote_addr - $remote_user [$time_local]  $status '
    '"$request" $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /dev/stdout;
  error_log /dev/stdout;

  sendfile     on;
  tcp_nopush   on;
  server_names_hash_bucket_size 128; # this seems to be required for some vhosts

  # Gzip for text assets. Without this, JS/CSS/JSON
  # responses ship uncompressed unless the upstream Coolify proxy happens to
  # compress them. Vite's build output is pre-minified — gzip typically cuts
  # it another ~70%.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/css
    text/javascript
    text/plain
    text/xml
    application/javascript
    application/json
    application/manifest+json
    application/xml
    application/rss+xml
    image/svg+xml;

  server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name localhost;

    $if(NIXPACKS_PHP_ROOT_DIR) (
      root ${NIXPACKS_PHP_ROOT_DIR};
    ) else (
      root /app;
    )

    # NOTE: browser-facing headers (CSP, HSTS, Permissions-Policy, ...) are
    # set by App\Http\Middleware\SecurityHeaders. Keeping them in one place
    # (Laravel) avoids the duplicate-header issue that occurs when both
    # nginx and the app set the same header independently. The static
    # locations below are the exception: they never reach PHP, so they set
    # their own X-Content-Type-Options + X-Frame-Options. The nixpacks
    # server-level copies of those two are stripped at runtime
    # (docker-start.sh §2a) so PHP responses carry only Laravel's.

    index index.php;
    charset utf-8;

    # Transport ceiling kept in sync with the PHP limits (64M, see
    # docker-start.sh §1). At runtime docker-start.sh sed-patches this
    # value into the generated template; present here so the reference
    # matches what actually serves traffic.
    client_max_body_size 64M;

    $if(IS_LARAVEL) (
      location / {
        try_files $uri $uri/ /index.php?$query_string;
      }
    ) else ()

    $if(NIXPACKS_PHP_FALLBACK_PATH) (
      location / {
        try_files $uri $uri/ ${NIXPACKS_PHP_FALLBACK_PATH}?$query_string;
      }
    ) else ()

    location = /favicon.ico { access_log off; log_not_found off; }

    # SEO OS: robots.txt is DYNAMIC (host-aware rules +
    # custom-domain sitemap references). Fall through to Laravel when no
    # static file exists (there is none by default — see
    # app/Http/Controllers/RobotsController.php).
    location = /robots.txt {
        access_log off; log_not_found off;
        try_files $uri /index.php?$query_string;
    }

    # Long-lived caching for immutable static assets.
    # - /build/     — Vite output; filenames are content-hashed → immutable.
    # - /assets/    — engine textures, HDRIs, audio, decoders; files change
    #                 only on deploy. 30d + immutable lets returning visitors
    #                 skip revalidation entirely.
    # - /decoders/  — DRACO/Basis wasm; version-locked to the three.js build.
    # - /img/       — site imagery.
    # Without these blocks, every repeat visit re-validates every asset (an
    # RTT per asset) or relies on heuristic caching. Regex locations take
    # precedence over the `location /` prefix match, and none of these paths
    # can contain .php, so the fastcgi block is never bypassed for
    # application routes.
    location ~* ^/(build|assets|decoders|img)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Uploaded artwork media (originals + WebP conversions) served
    # via the /storage symlink. Paths are stable per artwork; conversions are
    # regenerated only on re-upload. 7d (not immutable — re-uploads reuse the
    # same path, so a weekly revalidation keeps curator updates flowing).
    location ~* ^/storage/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    $if(IS_LARAVEL) (
      error_page 404 /index.php;
    ) else ()

    location ~ \.php$ {
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
      include $!{nginx}/conf/fastcgi_params;
      include $!{nginx}/conf/fastcgi.conf;
    }

    location ~ /\.(?!well-known).* {
      deny all;
    }
  }
}