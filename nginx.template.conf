worker_processes 5;
daemon off;

worker_rlimit_nofile 8192;

events {
  worker_connections  4096;  ## Default: 1024
}

http {
  include    $!{nginx}/conf/mime.types;
  index    index.html index.htm index.php;

  default_type application/octet-stream;
  log_format   main '$remote_addr - $remote_user [$time_local]  $status '
    '"$request" $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /dev/stdout;
  error_log /dev/stdout;

  sendfile     on;
  tcp_nopush   on;
  server_names_hash_bucket_size 128; # this seems to be required for some vhosts

  # PERF-A4 (3D audit F4): gzip for text assets. Without this, JS/CSS/JSON
  # responses ship uncompressed unless the upstream Coolify proxy happens to
  # compress them. Vite's build output is pre-minified — gzip typically cuts
  # it another ~70%.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name localhost;

    $if(NIXPACKS_PHP_ROOT_DIR) (
      root ${NIXPACKS_PHP_ROOT_DIR};
    ) else (
      root /app;
    )

    # NOTE: X-Frame-Options / X-Content-Type-Options intentionally omitted here.
    # They're set by App\Http\Middleware\SecurityHeaders instead, alongside CSP,
    # HSTS, Permissions-Policy, etc. Keeping them in one place (Laravel) avoids
    # the duplicate-header issue that occurs when both nginx and the app set
    # the same header independently.

    index index.php;
    charset utf-8;

    $if(IS_LARAVEL) (
      location / {
        try_files $uri $uri/ /index.php?$query_string;
      }
    ) else ()

    $if(NIXPACKS_PHP_FALLBACK_PATH) (
      location / {
        try_files $uri $uri/ ${NIXPACKS_PHP_FALLBACK_PATH}?$query_string;
      }
    ) else ()

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # PERF-A4 (3D audit F4): long-lived caching for immutable static assets.
    # - /build/     — Vite output; filenames are content-hashed → immutable.
    # - /assets/    — engine textures, HDRIs, audio, decoders; files change
    #                 only on deploy. 30d + immutable lets returning visitors
    #                 skip revalidation entirely.
    # - /decoders/  — DRACO/Basis wasm; version-locked to the three.js build.
    # - /img/       — site imagery.
    # Previously NONE of these had Cache-Control/expires — every repeat visit
    # re-validated every asset (an RTT per asset) or relied on heuristic
    # caching. Regex locations take precedence over the `location /` prefix
    # match, and none of these paths can contain .php, so the fastcgi block
    # is never bypassed for application routes.
    location ~* ^/(build|assets|decoders|img)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # PERF-A4: uploaded artwork media (originals + WebP conversions) served
    # via the /storage symlink. Paths are stable per artwork; conversions are
    # regenerated only on re-upload. 7d (not immutable — re-uploads reuse the
    # same path, so a weekly revalidation keeps curator updates flowing).
    location ~* ^/storage/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    $if(IS_LARAVEL) (
      error_page 404 /index.php;
    ) else ()

    location ~ \.php$ {
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
      include $!{nginx}/conf/fastcgi_params;
      include $!{nginx}/conf/fastcgi.conf;
    }

    location ~ /\.(?!well-known).* {
      deny all;
    }
  }
}