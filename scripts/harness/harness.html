<!doctype html>
<!-- ─────────────────────────────────────────────────────────────────────────────
  harness.html — PHP-less visual verification harness for the Exospace viewer.

  WHY: the production preview pages (/venues/{slug}/preview) need Laravel +
  a database. This page mounts the SAME viewer runtime (resources/js/gallery/
  main.js) on a static DOM skeleton with a synthetic GALLERY_DATA payload,
  so venue work can be visually verified (and screenshot-regressed) without
  a PHP stack — e.g. in CI or a build sandbox.

  It mirrors the DOM contract of resources/views/venues/preview.blade.php
  (only the ids the viewer actually touches) and builds GALLERY_DATA the way
  GalleryViewController + VenueConfigExporter do for a seeded venue.

  Query params drive the artwork scenarios:
    count=8            number of artworks (default 8, max 60)
    orient=mixed       mixed | portrait | landscape | square | extreme
    layout=square      square | corridor | l-shape | rotunda
    frame=minimal      any FRAME_STYLES key
    exposure=off       skip EXOSPACE_FORCE_* (unused placeholder)
  The page is built by scripts/harness/vite.harness.config.mjs into
  public/harness/ and served from the Laravel public/ root (asset paths like
  /assets/sample/artworks/*.jpg resolve from there; missing PBR texture sets
  are handled by the viewer's own fallbacks).
───────────────────────────────────────────────────────────────────────────── -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exospace Viewer Harness</title>
<style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0f0f0f; }
    #canvas-container { position: fixed; inset: 0; }
    #canvas-container canvas { display: block; width: 100%; height: 100%; }
    #entrance-curtain { position: fixed; inset: 0; background: #0f0f0f; z-index: 1000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #fff; font-family: system-ui, sans-serif; }
    .entrance-button { padding: 0.75rem 2.5rem; font-size: 1rem; border-radius: 9999px;
        border: none; cursor: pointer; background: #3b82f6; color: #fff; font-weight: 600; }
    #curtain-progress-bar-track { width: 300px; height: 6px; background: rgba(255,255,255,.15);
        border-radius: 9999px; overflow: hidden; }
    #curtain-progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg,#3b82f6,#8b5cf6); }
    #crosshair { position: fixed; top: 50%; left: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
        border-radius: 50%; background: rgba(255,255,255,.7); z-index: 500; pointer-events: none; }
    #webgl-recovery { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 1200;
        display: none; align-items: center; justify-content: center; color: #fff; }
    #mobile-overlay { display: none; }
</style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="entrance-curtain">
        <h1 id="curtain-title">Exospace Harness</h1>
        <div id="curtain-progress">
            <div style="display:flex;justify-content:space-between;width:300px;">
                <span id="curtain-progress-text">Preparing venue...</span>
                <span id="curtain-progress-percent">0%</span>
            </div>
            <div id="curtain-progress-bar-track"><div id="curtain-progress-bar"></div></div>
        </div>
        <button id="enter-btn" class="entrance-button" style="opacity:0.5;pointer-events:none;">Enter Exhibition</button>
        <a href="#" id="skip-intro-link">Skip intro</a>
    </div>

    <div id="crosshair" aria-hidden="true"></div>
    <div id="webgl-recovery"><p>WebGL context lost — recovering…</p></div>
    <div id="mobile-overlay"></div>
    <div id="controls-hint" class="sr-only"></div>

<script>
// ── Synthetic GALLERY_DATA (mirrors VenueConfigExporter.forVenuePreview) ────
(function buildHarnessData() {
    const q = new URLSearchParams(location.search);
    const count      = Math.max(1, Math.min(60, parseInt(q.get('count') || '8', 10)));
    const orient     = q.get('orient') || 'mixed';
    const layout     = q.get('layout') || 'square';

    // The 12 sample works ship in the repo (aspect-true dimensions).
    const LIB = [
        { file: 'ascending-figure.jpg',  w: 1280, h: 1920 }, // portrait 2:3
        { file: 'cathedral-static.jpg',  w: 1280, h: 1920 },
        { file: 'vertical-chorus.jpg',   w: 1280, h: 1920 },
        { file: 'night-window.jpg',      w: 1280, h: 1920 },
        { file: 'dawn-lattice.jpg',      w: 1920, h: 1280 }, // landscape 3:2
        { file: 'harbour-light.jpg',     w: 1920, h: 1280 },
        { file: 'north-field.jpg',       w: 1920, h: 1280 },
        { file: 'tide-memorandum.jpg',   w: 1920, h: 1280 },
        { file: 'quiet-field.jpg',       w: 1600, h: 1600 }, // square 1:1
        { file: 'signal-bloom.jpg',      w: 1600, h: 1600 },
        { file: 'slow-nebula.jpg',       w: 1600, h: 1600 },
        { file: 'stone-arrangement.jpg', w: 1600, h: 1600 },
    ];
    let pool;
    switch (orient) {
        case 'portrait':  pool = LIB.filter(x => x.h > x.w); break;
        case 'landscape': pool = LIB.filter(x => x.w > x.h); break;
        case 'square':    pool = LIB.filter(x => x.w === x.h); break;
        case 'extreme':   // degenerate aspect stress test — synthetic ultra-wide/ultra-tall metadata
            pool = LIB.slice(0, 2);
            break;
        default:          pool = LIB; break; // mixed
    }

    const images = [];
    for (let i = 0; i < count; i++) {
        const src  = pool[i % pool.length];
        let width  = src.w, height = src.h;
        if (orient === 'extreme') {
            // 5:1 panorama and 1:5 tower — the geometry clamps must hold.
            if (i % 2 === 0) { width = 2000; height = 400; }
            else             { width = 400;  height = 2000; }
        }
        const file = src.file.replace(/\.\w+$/, '');
        images.push({
            id: 1000 + i,
            url: `/assets/sample/artworks/${src.file}`,
            textures: null, // legacy payload shape — pickTextureUrl falls back to img.url
            width, height,
            aspectRatio: width / Math.max(height, 1),
            orientation: width === height ? 'square' : (width > height ? 'landscape' : 'portrait'),
            title: `Harness Work ${i + 1}`,
            description: 'Synthetic harness artwork.',
            artist: null, price: null, currency: null, formattedPrice: null,
            forSale: false, medium: null, year: null, dimensions: null, edition: null, externalUrl: null,
        });
    }

    // White Cube's seeded template row (database/seeders/VenueTemplateSeeder.php).
    // In production this arrives from the DB via VenueConfigExporter; here it is
    // the same JSON a fresh install seeds (polish iteration values). Keep in
    // sync with the seeder — scripts/venue-qa/white-cube-qa.mjs pins the pair.
    const venueConfig = {
        id: 1, slug: 'white-cube', name: 'Modern White Cube', category: 'gallery',
        visual_config: {
            wall_height: 4, wall_depth: 0.3, ceiling_type: 'flat', ceiling_height: 4,
            background_color: '0xf2f1ee', fog_color: '0xf2f1ee', fog_near: 16, fog_far: 60,
            ambient_color: '0xffffff', ambient_intensity: 0.55, spot_intensity: 3.2,
            fill_intensity: 2.6, tone_mapping_exposure: 1.05, frame_override: null,
            structure_pass: 'cube',
            post_fx: { bloom: false, vignette: true, vignette_darkness: 0.28, vignette_offset: 1.05 },
        },
        material_config: {
            wall_color: null, wall_roughness: 0.9, wall_metalness: 0.0, wall_normal_strength: 0.3,
            floor_color: '0x9c9c98', floor_roughness: 0.55, floor_metalness: 0.0,
            floor_normal_strength: 0.4, floor_tile_meters: 2.0,
        },
        decorations: [], lighting_fixtures: [],
        supported_layouts: ['square', 'corridor', 'l-shape', 'rotunda'],
        hdri_url: null, default_audio_url: null,
        default_settings: {
            wall_texture: 'white', floor_material: 'concrete', lighting_preset: 'bright',
            frame_style: 'modern', room_layout: 'square',
        },
    };

    // ?frame= overrides; absent → the venue's default (what a preview shows).
    const frameStyle = q.get('frame') || venueConfig.default_settings.frame_style;

    window.GALLERY_DATA = {
        id: 'harness', title: 'Harness Exhibition', description: '',
        wall_texture: 'white', floor_material: 'concrete',
        frame_style: frameStyle, lighting_preset: 'bright',
        room_layout: layout, venue_slug: 'white-cube',
        venueConfig, images, imageCount: images.length,
        audioUrl: null, userPlan: 'pro', customLogoUrl: null, curtainLogoUrl: null,
        curtainBgColor: null, newsletterUrl: null, eventsUrl: null, hasUpcomingEvents: false,
        deepLinkArtworkId: null, arrival_enabled: true,
        isPreview: true,
    };
    window.EXOSPACE_TRACK_URL = null;
    window.__HARNESS_READY = true;
})();
</script>
<script type="module" src="/resources/js/gallery/main.js"></script>
</body>
</html>
