[phases.setup]
# Removed "phpPackages.imagick" — the pinned nixpkgs archive
# (e24b4c09e963677b1beea49d411cd315a024ad3a) no longer ships it,
# which broke the Docker image build at step 4/18 ("attribute 'imagick' missing").
# Image processing in this app uses GD (already enabled via
# NIXPACKS_PHP_EXTENSIONS=gd in .env), so imagick is not required.
nixPkgs = ["php", "nginx", "nodejs", "phpPackages.composer", "mariadb"]

[phases.build]
cmds = [
    "npm ci --no-audit --no-fund",
    "npm run build",
    # GUARD (2026-08-31): fails the build if any Blade template references a
    # Vite entry the manifest does not contain (e.g. the production 500
    # "Unable to locate file in Vite manifest: admin-vendor.js" that shipped
    # because a JS comment in analytics.blade.php contained an unescaped
    # @vite('admin-vendor.js') — Blade compiles directives inside JS comments).
    "node scripts/verify-vite-manifest.js",
    # GUARD (2026-09-17): the lockfile is validated against the build PHP
    # BEFORE the strict install. `composer update` run on a dev machine with
    # a newer PHP can lock packages the production PHP cannot load (real
    # incident: maennchen/zipstream-php 3.2.2 requires php-64bit ^8.3 while
    # this build runs PHP 8.2.27, which aborted deploys with "Your lock file
    # does not contain a compatible set of packages"). composer.json now
    # pins config.platform.php = 8.2.27 so this cannot recur, and these two
    # read-only checks fail the build with a precise message if the lock and
    # composer.json ever drift out of sync or off the production platform.
    "composer validate --strict --no-check-publish",
    "composer check-platform-reqs --lock --no-dev",
    "composer install --no-dev --optimize-autoloader",
    # Route/view caches are safe to build here — they don't depend on
    # runtime secrets. Config cache must NOT be built anywhere in this
    # pipeline (neither here nor in docker-start.sh): Coolify delivers
    # secrets like DB_HOST/DB_PASSWORD as runtime .env values, and once
    # config is cached Laravel skips loading .env entirely — baking in
    # empty values that no runtime env var can ever override.
    "php artisan route:cache",
    "php artisan view:cache",
    # GUARD (2026-08-31): view:cache compiles Blade to PHP WITHOUT checking
    # that the generated PHP is valid — broken templates used to bake silently
    # and 500 at runtime ("syntax error, unexpected end of file, expecting
    # elseif or else or endif"). php -l every compiled view and fail the
    # build instead.
    "bash scripts/lint-compiled-views.sh"
]

[start]
cmd = "bash docker-start.sh"
