; A-2 FIX (Iter-006): Supervisord configuration for queue worker process management.
;
; This file should be placed at /etc/supervisor/conf.d/exospace-worker.conf
; inside the Docker container. The nixpacks.toml [phases.setup] section
; should install supervisord:
;   nixPkgs = ["php", "nginx", "nodejs", "phpPackages.composer", "supervisor"]
;
; Alternatively, the operator can define a separate Coolify service running
; `php artisan queue:work` — that approach doesn't need supervisord.
;
; Supervisord ensures the queue worker:
;   1. Starts automatically when the container starts
;   2. Restarts if it crashes (OOM, fatal error, etc.)
;   3. Logs to a separate file for debugging
;
; The docker-start.sh script should be updated to start supervisord instead
; of the background `&` approach:
;   supervisord -c /etc/supervisor/supervisord.conf
;
; Or, if using the in-container approach:
;   supervisord -n -c /assets/supervisord.conf

[program:exospace-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work redis --tries=3 --timeout=120 --sleep=3 --memory=512 --max-jobs=1000 --max-time=3600 --queue=high,default,low
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/app/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=30
; K-10 FIX (Iter-001): memory=512 to accommodate image processing peak
; N-6 (future): add a second program for --queue=high (priority worker)

[program:exospace-scheduler]
process_name=%(program_name)s
command=/bin/sh -c "while true; do php /app/artisan schedule:run --no-interaction >> /app/storage/logs/scheduler.log 2>&1; sleep 60; done"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/app/storage/logs/scheduler-supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=10
; CR-2 FIX (Iter-001): scheduler loop as a supervised process (no more bare `&`)
